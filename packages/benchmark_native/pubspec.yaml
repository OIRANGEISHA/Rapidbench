name: benchmark_native
description: Dart FFI facade for the Android CPU Benchmark native core.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.cpu_benchmark.benchmark_native
        pluginClass: BenchmarkNativePlugin
        ffiPlugin: true
