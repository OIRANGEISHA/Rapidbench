group = "dev.cpu_benchmark.benchmark_native"
version = "0.1.0"

apply plugin: "com.android.library"

android {
    namespace = "dev.cpu_benchmark.benchmark_native"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path = file("CMakeLists.txt")
            version = "3.22.1"
        }
    }
}
